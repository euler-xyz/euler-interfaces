name: Deployed Code Verification

on:
  pull_request:
  workflow_dispatch:

jobs:
  deployed-code-verification:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/checkout@v4
        with:
          repository: euler-xyz/euler-verifier
          # Engine pinned by commit SHA; bump deliberately via PR.
          ref: 399267df26c2b5df81093dc1ede9c60b9d876100
          path: .verifier

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: .verifier/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: pnpm
          cache-dependency-path: .verifier/pnpm-lock.yaml
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.7.1

      - run: pnpm install --frozen-lockfile
        working-directory: .verifier

      - name: Validate manifests (schema, SHA-only pins, audits integrity)
        run: pnpm tsx src/validate-manifests.ts --manifest $GITHUB_WORKSPACE/verify/manifest.json --audits $GITHUB_WORKSPACE/verify/audits.json --baselines $GITHUB_WORKSPACE/verify/baselines.json
        working-directory: .verifier

      - name: Completeness (every deployed address has a manifest entry)
        run: pnpm tsx src/check-completeness.ts --manifest $GITHUB_WORKSPACE/verify/manifest.json --addresses $GITHUB_WORKSPACE/addresses
        working-directory: .verifier

      - name: Select the chains to prove
        id: changed
        run: |
          # A pull_request checkout is GitHub's merge commit: its first parent is the base branch.
          CHAINS=""
          if [ "$GITHUB_EVENT_NAME" = pull_request ]; then
            CHAINS=$(node scripts/proof-chains.mjs --base HEAD^1 --head HEAD)
          fi
          echo "chains=$CHAINS" >> $GITHUB_OUTPUT
          echo "changed chains: ${CHAINS:-none}"

      - name: Bytecode-verify the selected chains and their delegated code
        if: steps.changed.outputs.chains != ''
        env:
          CHAINS: ${{ steps.changed.outputs.chains }}
        run: |
          set -e
          for c in ${CHAINS//,/ }; do
            pnpm verify --manifest $GITHUB_WORKSPACE/verify/manifest.json --addresses $GITHUB_WORKSPACE/addresses --chains $GITHUB_WORKSPACE/EulerChains.json --chain "$c" --no-explorer
          done
        working-directory: .verifier
