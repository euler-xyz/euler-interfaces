name: Verify EulerChains.json

on:
  pull_request:
    branches: [master]
    paths:
      - 'chains.js'
      - 'EulerChains.json'
      - 'addresses/**'
      - 'config/addresses/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/chains-manifest-consistency.yml'
  push:
    branches: [master]
    paths:
      - 'chains.js'
      - 'EulerChains.json'
      - 'addresses/**'
      - 'config/addresses/**'
      - 'scripts/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/chains-manifest-consistency.yml'
  workflow_dispatch:

jobs:
  verify-chains-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Regenerate EulerChains.json
        run: node chains.js

      - name: Verify no drift
        run: |
          if ! git diff --quiet -- EulerChains.json; then
            echo "::error::EulerChains.json is out of sync with the addresses in the repo."
            echo "Run 'node chains.js' locally and commit the updated EulerChains.json."
            echo ""
            echo "Drift:"
            git --no-pager diff -- EulerChains.json
            exit 1
          fi
          echo "EulerChains.json matches the output of chains.js."

      - name: Test the chain validator
        run: npm test

      - name: Validate chain status, explorerUrl and viem resolution
        run: npm run validate
